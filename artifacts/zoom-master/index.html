<!DOCTYPE html>
<html lang="en">
  <head>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://sad.adsgram.ai/js/sad.min.js"></script>
    <script>
      const tg = window.Telegram.WebApp;
      tg.ready();
      tg.expand();
      try { tg.disableVerticalSwipes(); } catch(e) {}
      try { tg.setHeaderColor('#000000'); } catch(e) {}
      try { tg.setBackgroundColor('#000000'); } catch(e) {}
      try { tg.setBottomBarColor('#000000'); } catch(e) {}
      try { if (tg.requestFullscreen) tg.requestFullscreen(); } catch(e) {}

      // Persist start_param immediately before React mounts
      try {
        const sp = tg.initDataUnsafe && tg.initDataUnsafe.start_param;
        if (sp) {
          localStorage.setItem("zoom-start-param", sp);
        }
      } catch(e) {}
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>ZOOM MASTER</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    #splash-screen {
      position: fixed;
      inset: 0;
      z-index: 99999;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #060810;
      transition: opacity 0.6s ease-in-out;
      opacity: 1;
    }
    #splash-screen.hidden {
      opacity: 0;
      pointer-events: none;
    }
    #splash-screen .splash-inner {
      text-align: center;
      animation: splashIn 0.6s ease-out both;
    }
    @keyframes splashIn {
      from { opacity: 0; transform: scale(0.85); }
      to { opacity: 1; transform: scale(1); }
    }
    #splash-screen .splash-emoji {
      font-size: 72px;
      margin-bottom: 12px;
      filter: drop-shadow(0 0 24px rgba(106,90,205,0.6));
      animation: splashEmoji 2s ease-in-out infinite;
    }
    @keyframes splashEmoji {
      0%, 100% { filter: drop-shadow(0 0 24px rgba(106,90,205,0.6)); transform: scale(1); }
      50% { filter: drop-shadow(0 0 36px rgba(138,180,255,0.8)); transform: scale(1.08); }
    }
    #splash-screen .splash-title {
      font-family: 'Orbitron', sans-serif;
      font-weight: 900;
      font-size: 28px;
      letter-spacing: 0.2em;
      color: #e0e6ff;
      text-shadow: 0 0 12px rgba(138,180,255,0.4), 0 0 32px rgba(106,90,205,0.3);
    }
    #splash-screen .splash-sub {
      margin-top: 8px;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.15em;
      color: rgba(255,255,255,0.3);
      text-transform: uppercase;
    }
  </style>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="splash-screen">
      <div class="splash-inner">
        <div class="splash-emoji">🪐</div>
        <div class="splash-title">ZOOM</div>
        <div class="splash-sub">Loading</div>
      </div>
    </div>
    <script>
      (function() {
        var splash = document.getElementById('splash-screen');
        function hide() {
          if (!splash) return;
          splash.classList.add('hidden');
          setTimeout(function() { splash && splash.remove(); }, 700);
        }
        // Show splash for 1.2s in both dev and production.
        var delay = 1200;
        setTimeout(hide, delay);
        window.addEventListener('load', function() { setTimeout(hide, delay); });
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
