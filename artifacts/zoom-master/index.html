<!DOCTYPE html>
<html lang="en">
  <head>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script>
      const tg = window.Telegram.WebApp;
      tg.ready();
      tg.expand();
      try { tg.disableVerticalSwipes(); } catch(e) {}
      try { tg.setHeaderColor('#060810'); } catch(e) {}
      try { tg.setBackgroundColor('#060810'); } catch(e) {}
      try { tg.setBottomBarColor('#060810'); } catch(e) {}
      try { if (tg.requestFullscreen) tg.requestFullscreen(); } catch(e) {}

      // Persist start_param immediately before React mounts
      try {
        const sp = tg.initDataUnsafe && tg.initDataUnsafe.start_param;
        if (sp) {
          localStorage.setItem("zoom-start-param", sp);
        }
      } catch(e) {}
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>ZOOM MASTER</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
